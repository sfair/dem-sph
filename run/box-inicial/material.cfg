materials = (
    {
        # material ID, starting at 0
        ID = 0
        name = "Sand"
        # smoothing length
        sml = 0.02014989942
        # no. interactions for variable sml
        interactions = 30
        artificial_viscosity = { alpha = 0.8; beta = 1.0; };
        density_floor = 10.
        eos = {
            type = 1
            # basic properties
            shear_modulus = 40.0e7
            bulk_modulus = 25.0e7
            # Tillotson EoS params
            @include "sand.till.cfg"
            # plasticity params
            yield_stress = 3.5e9
            # from Benz & Asphaug (1999)
            melt_energy = 3.4e6
