            n = 5.0
            rho_0 = 2.20e3
            friction_angle = 0.523599
            cohesion = 0.0e0
        };
    },
    	
    	    {
        # material ID, starting at 0
        ID = 1
        name = "Basalt"
        # smoothing length
        sml = 0.02014989942
        # no. interactions for variable sml
        interactions = 30
        artificial_viscosity = { alpha = 1.0; beta = 2.0; };
        density_floor = 10.
        eos = {
            type = 2
            # basic properties
            shear_modulus = 22.7e9
            bulk_modulus = 26.7e9
            # Tillotson EoS params
            @include "basalt.till.cfg"
            # plasticity params
            yield_stress = 3.5e9
            # from Benz & Asphaug (1999)
            melt_energy = 3.4e6
            # Murnaghan EoS params (Melosh, 1989)
            n = 5.5
            rho_0 = 2.86e3
        };
    },
    
        {
        # material ID, must match SFAIR_WALL_MATID in parameter.h
        ID = 2
        name = "Wall"
        # same smoothing length and interactions as the sand
        sml = 0.008059959770082347
        interactions = 30
        # no effect on the sand (alpha of the particle itself is used), kept equal to the sand
        artificial_viscosity = { alpha = 0.8; beta = 0.5; };
        eos = {
            # Murnaghan: pressure depends only on density, p = K0/n [(rho/rho_0)^n - 1]
            type = 1
            # K0, same as the sand; cs = sqrt(K0/rho_0) ~ 340 m/s at rest
            bulk_modulus = 25.0e7
            # stiffens quickly when the sand pushes in, without raising cs at rest
            n = 7.0
            # initial density of the wall particles in the input file, so p = 0 at start
            rho_0 = 2.20e3
            # p = 0 below rho_0: the wall pushes but never pulls
            rho_limit = 1.0
            # walls carry no deviatoric stress; also keeps them out of the shear term of the timestep
            shear_modulus = 0.0
            # not used by the walls (S is zeroed in boundary.cu), but must be > 0:
            # COLLINS_PLASTICITY_SIMPLE divides by (yield_stress - cohesion)
            yield_stress = 3.5e9
        };
    }

);

